<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Opskrifter</title>

    <!-- PWA — relative stier, så det også virker i en undermappe (GitHub Pages) -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Opskrifter" />
    <!-- Sæt tema FØR React renderer for at undgå flash -->
    <script>
      (function() {
        var saved = localStorage.getItem('theme')
        // Default: dark hvis intet er gemt
        if (saved === 'light') {
          document.documentElement.classList.remove('dark')
        } else {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
